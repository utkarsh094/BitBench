<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitBench — Digital Circuit Simulator</title>
<meta name="description" content="Terminal-based digital circuit simulator using bit manipulation. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0a;
    --panel: #101309;
    --panel-edge: #23281a;
    --amber: #ffb000;
    --amber-dim: #a67300;
    --green: #5fd97a;
    --red: #ff5f56;
    --grey: #6b7160;
    --grey-dim: #3d4234;
    --text: #e8e6d9;
    --scanline: rgba(255, 176, 0, 0.02);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,176,0,0.05), transparent 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .masthead {
    width: 100%;
    max-width: 880px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }

  .masthead h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.14em;
    margin: 0;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(255,176,0,0.35);
  }

  .masthead .tag {
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.06em;
  }

  .masthead a {
    color: var(--grey);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    border-bottom: 1px dotted var(--grey-dim);
    transition: color 0.15s ease;
  }
  .masthead a:hover { color: var(--amber); }

  .terminal-wrap {
    width: 100%;
    max-width: 880px;
    position: relative;
  }

  .terminal {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 0 80px -10px rgba(255,176,0,0.06);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(180deg, #171a10, #12140b);
    border-bottom: 1px solid var(--panel-edge);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; opacity: 0.85; }
  .dot.r { background: #ff5f56; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #27c93f; }

  .titlebar .path {
    margin-left: 8px;
    font-size: 11.5px;
    color: var(--grey);
    letter-spacing: 0.03em;
  }

  .crt {
    position: relative;
    height: 560px;
    overflow: hidden;
  }

  .crt::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      var(--scanline) 0px,
      var(--scanline) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .output {
    height: 100%;
    overflow-y: auto;
    padding: 18px 18px 8px;
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    cursor: text;
  }

  .output:focus {
  outline: none;
}

.terminal-input-line {
  display: block;
  min-height: 21px;
}

.terminal-prompt {
  color: var(--amber);
  font-weight: 700;
}

.terminal-input-text {
  color: var(--text);
}

  .output::-webkit-scrollbar { width: 9px; }
  .output::-webkit-scrollbar-track { background: transparent; }
  .output::-webkit-scrollbar-thumb {
    background: var(--panel-edge);
    border-radius: 5px;
  }

  .line { margin: 0 0 2px; }
  .line.banner { color: var(--amber); font-weight: 700; }
  .line.dim { color: var(--grey); }
  .line.ok { color: var(--green); }
  .line.err { color: var(--red); }
  .line.prompt { color: var(--amber); }
  .line.echo { color: var(--text); }
  .line.rule { color: var(--grey-dim); }
  .line.table-head { color: var(--amber); font-weight: 700; }

  .cursor-blink {
    display: inline-block;
    width: 6px;
    height: 15px;
    background: rgba(255, 176, 0, 0.70);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hint-row {
    max-width: 880px;
    width: 100%;
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.02em;
  }

  .hint-row kbd {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: inherit;
    color: var(--amber-dim);
  }

  .footer-note {
    max-width: 880px;
    width: 100%;
    margin-top: 34px;
    font-size: 11px;
    color: var(--grey-dim);
    text-align: center;
    line-height: 1.6;
  }
  .footer-note a { color: var(--grey); }

  @media (max-width: 600px) {
    .crt { height: 68vh; }
    .masthead h1 { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor-blink { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="masthead">
    <div>
      <h1>BITBENCH</h1>
      <div class="tag">digital circuit simulator · bit manipulation</div>
    </div>
    <a href="https://github.com/utkarsh094/BitBench" target="_blank" rel="noopener">source on github ↗</a>
  </div>

  <div class="terminal-wrap">
    <div class="terminal">

        <div class="titlebar">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
            <span class="path">bitbench@terminal:~</span>
        </div>

        <div class="crt">
            <div
                id="output"
                class="output"
                tabindex="0"
            ></div>
        </div>

    </div>
</div>
    </div>
  </div>

  <div class="hint-row">
    <span>runs entirely in your browser — no install, no java required</span>
    <span><kbd>enter</kbd> to submit &nbsp; <kbd>↑</kbd> history</span>
  </div>

  <div class="footer-note">
    Want the real thing on your own machine? <a href="https://github.com/utkarsh094/BitBench" target="_blank" rel="noopener">grab the jar from the repo</a>.
  </div>
</div>

<script src="BitBench2.js"></script>
</body>
</html>
